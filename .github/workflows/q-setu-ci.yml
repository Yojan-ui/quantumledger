name: q-setu CI

# Every action is pinned to a full commit SHA (the tag is in the comment); Dependabot proposes updates.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: q-setu

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: q-setu/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 ships OpenSSL 3.5, which Shield Edge needs for X25519MLKEM768.
          node-version: 24
          cache: pnpm
          cache-dependency-path: q-setu/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint, lint:design, Prettier)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Initial JS budget
        run: pnpm check:budget
      - name: Shield Edge performance budget (fails the build if missed)
        run: pnpm --filter @qsetu/shield-edge bench:quick
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke tests (offline mode)
        run: pnpm test:e2e
        env:
          PW_CHANNEL: ""
      - name: Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results
          path: q-setu/test-results
          retention-days: 7
      - name: Lighthouse CI (Perf ≥ 90, A11y 100, SEO 100, LCP < 2.0 s, CLS < 0.05)
        run: pnpm dlx @lhci/cli@0.15.1 autorun

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: q-setu/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: q-setu/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (high and critical fail; exceptions in docs/security/audit-exceptions.md)
        run: pnpm audit --audit-level high
      - name: Secret scan (gitleaks, full history)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Organisations need a (free) licence key; personal accounts don't.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
      - name: Software bill of materials (CycloneDX)
        run: pnpm dlx @cyclonedx/cdxgen@12.8.5 -t pnpm -o sbom.cdx.json --spec-version 1.6 .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: q-setu/sbom.cdx.json

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read # the analyze step reads the workflow run
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: javascript-typescript
          source-root: q-setu
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
