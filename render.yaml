# Deploy QuantumLedger to Render as a Docker Web Service.
#   New → Web Service → Build and deploy from a Git repository → pick this repo → Runtime: Docker.
# Render reads this file. No secret is stored here: QSETU_KMS_KEK is generated by Render on first
# deploy, and the Lab demo accounts below are not secrets (they are passwordless demo logins).
services:
  - type: web
    name: quantumledger
    runtime: docker
    rootDir: q-setu
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: QSETU_DATA_DIR
        value: /data
      - key: ATTACK_LAB_DIR
        value: /data/attack-lab
      - key: ATTACK_LAB_API
        value: http://127.0.0.1:4100
      - key: LAB_PORT
        value: "4100"
      # Passwordless demo sign-ins for /lab (not secrets).
      - key: LAB_DEMO_ACCOUNTS
        value: team@quantumledger.dev=team,ciso@ledgerwood.example=customer:ledgerwood,it@sahyadri.example=customer:sahyadri
      # Wraps every KMS key; Render generates and stores it (never in the repo).
      - key: QSETU_KMS_KEK
        generateValue: true
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
