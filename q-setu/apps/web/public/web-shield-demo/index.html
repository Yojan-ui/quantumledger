<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scholarship application: a plain HTML form</title>
    <!-- The only change needed to make this form quantum-safe: -->
    <script src="/qsetu.js" data-key="af29da952c68ee32" data-endpoint="/api/web-shield/"></script>
    <link rel="stylesheet" href="/tokens.css" />
    <style>
      body {
        font:
          16px/26px system-ui,
          sans-serif;
        background: var(--bg);
        color: var(--text-2);
        max-width: 560px;
        margin: 96px auto;
        padding: 0 20px;
      }
      h1 {
        color: var(--text);
        font-weight: 500;
        font-size: 28px;
        line-height: 34px;
        letter-spacing: -0.02em;
        margin: 0 0 16px;
      }
      label {
        display: block;
        margin-top: 16px;
        color: var(--text-3);
        font:
          12px/16px ui-monospace,
          monospace;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      input,
      select {
        width: 100%;
        box-sizing: border-box;
        margin-top: 8px;
        height: 40px;
        padding: 0 12px;
        background: var(--bg-inset);
        color: var(--text);
        border: 1px solid var(--line);
        border-radius: 6px;
        font:
          14px system-ui,
          sans-serif;
      }
      button {
        margin-top: 32px;
        height: 40px;
        padding: 0 16px;
        border: 0;
        border-radius: 6px;
        background: var(--text);
        color: var(--bg);
        font:
          500 14px system-ui,
          sans-serif;
        cursor: pointer;
      }
      .status {
        margin-top: 32px;
        font:
          12px/16px ui-monospace,
          monospace;
        color: var(--text-3);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      html[data-qsetu="on"] .status::before {
        content: "● QuantumLedger Web active: this form is sealed with ML-KEM before it leaves your browser";
        color: var(--text-2);
      }
      code {
        font:
          14px ui-monospace,
          monospace;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <h1>State scholarship application</h1>
    <p>
      An ordinary HTML form posting to an ordinary endpoint. View source: the only QuantumLedger
      code is one <code>&lt;script&gt;</code> tag.
    </p>
    <form action="/api/web-shield/submit" method="post">
      <label>Full name <input name="fullName" value="Kavya Nair" autocomplete="off" /></label>
      <label>Student ID <input name="studentId" value="APR482019377" autocomplete="off" /></label>
      <label
        >Annual family income (₹) <input name="income" value="3,40,000" autocomplete="off"
      /></label>
      <label
        >Bank account
        <input name="account" value="XXXXXX4821 · IFSC BHRT0001234" autocomplete="off"
      /></label>
      <label
        >Category
        <select name="category">
          <option>General</option>
          <option selected>OBC</option>
          <option>SC</option>
          <option>ST</option>
        </select>
      </label>
      <button type="submit">Submit application</button>
    </form>
    <p class="status"></p>
  </body>
</html>
