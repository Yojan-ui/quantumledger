name: CI

# Note: GitHub only runs workflows from the repository root. If q-setu lives in a subfolder of a
# larger repo, move this file to <root>/.github/workflows and set `defaults.run.working-directory`.

on:
  push:
    branches: [main, final-pass]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint (ESLint, lint:design, Prettier)
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (incl. ledger on SQLite and Postgres via PGlite)
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Initial JS budget (home ≤ 250 KB gzip)
        run: pnpm check:budget
      - run: pnpm exec playwright install --with-deps chromium
      - name: Playwright smoke tests (every page and demo, offline mode)
        run: pnpm test:e2e
        env:
          PW_CHANNEL: ""
      - name: Lighthouse CI (Perf ≥ 90, A11y 100, SEO 100, LCP < 2.0 s, CLS < 0.05)
        run: pnpm dlx @lhci/cli@0.15.x autorun
